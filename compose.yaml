name: retail-platform

x-app-common: &app-common
  restart: unless-stopped
  networks:
    - retail-network

services:
  postgres:
    image: postgres:17-alpine
    profiles: [infra, full]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_users}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - retail-network

  mongodb:
    image: mongo:8
    profiles: [infra, full]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-retail}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-retail-local}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./infrastructure/docker/mongodb/init.js:/docker-entrypoint-initdb.d/001-init.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_INITDB_ROOT_USERNAME:-retail}",
          "--password",
          "${MONGO_INITDB_ROOT_PASSWORD:-retail-local}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - retail-network

  neo4j:
    image: neo4j:2025-community
    profiles: [infra, full]
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-retail-local-password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u $${NEO4J_USERNAME:-neo4j} -p $${NEO4J_PASSWORD:-retail-local-password} 'RETURN 1' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - retail-network

  api-gateway:
    <<: *app-common
    profiles: [full]
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      USERS_SERVICE_URL: http://users-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      RECOMMENDATIONS_SERVICE_URL: http://recommendations-service:3003
      PAYMENTS_SERVICE_URL: http://payments-service:3004
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-with-at-least-32-characters}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      users-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      recommendations-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy

  users-service:
    <<: *app-common
    profiles: [full]
    build:
      context: .
      dockerfile: apps/users-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD:-retail-local}@postgres:5432/${POSTGRES_DB:-retail_users}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD:-retail-local}@postgres:5432/${POSTGRES_DB:-retail_users}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-with-at-least-32-characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-with-another-32-character-secret}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    <<: *app-common
    profiles: [full]
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-retail}:${MONGO_INITDB_ROOT_PASSWORD:-retail-local}@mongodb:27017/retail_catalog?authSource=admin
      MONGODB_DB: ${MONGODB_DB_NAME:-retail_catalog}
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      mongodb:
        condition: service_healthy

  recommendations-service:
    <<: *app-common
    profiles: [full]
    build:
      context: .
      dockerfile: apps/recommendations-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3003
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-retail-local-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    expose:
      - "3003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      neo4j:
        condition: service_healthy

  payments-service:
    <<: *app-common
    profiles: [full]
    build:
      context: .
      dockerfile: apps/payments-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3004
      TRANSBANK_ENVIRONMENT: ${TRANSBANK_ENVIRONMENT:-integration}
      WEBPAY_RETURN_URL: ${WEBPAY_RETURN_URL:-http://localhost:5173/payments/result}
      TRANSBANK_COMMERCE_CODE: ${TRANSBANK_COMMERCE_CODE:-}
      TRANSBANK_API_KEY: ${TRANSBANK_API_KEY:-}
    expose:
      - "3004"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    <<: *app-common
    profiles: [full]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      api-gateway:
        condition: service_healthy

networks:
  retail-network:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
  neo4j-data:
